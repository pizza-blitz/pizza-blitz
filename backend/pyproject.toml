[project]
name = "pizza-blitz-api"
version = "0.1.0"
description = "Pizza Blitz FastAPI service for Vercel deployment"
# The local workstation and the backend Docker image both run Python 3.11,
# so the declared range has to include it.
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "apscheduler>=3.11,<4",
  "boto3>=1.34,<2",
  "email-validator>=2.3,<3",
  "fastapi>=0.123,<1",
  "google-api-python-client>=2.187,<3",
  "google-auth>=2.43,<3",
  "google-genai>=1.55,<2",
  "psycopg2-binary>=2.9,<3",
  "pydantic-settings>=2.12,<3",
  "pypdf>=4.0,<6",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.2,<2",
  "python-jose[cryptography]>=3.5,<4",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.0,<5",
  "SQLAlchemy>=2.0,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.30,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Alembic's scaffold and generated migrations are checked separately.
extend-exclude = ["alembic"]

[tool.ruff.lint]
# E4/E7/E9 are correctness-oriented pycodestyle checks; F is pyflakes, B is
# bugbear, S is the bandit security set.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
  # FastAPI dependency injection lives in argument defaults by design.
  "B008",
  # Outbound URLs come from configured provider base URLs, not user input.
  "S310",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use literal throwaway credentials and assertions.
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]

